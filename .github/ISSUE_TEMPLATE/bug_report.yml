name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** include private keys, wallet
        files, or other secrets. For security vulnerabilities, see SECURITY.md
        instead of filing a public issue.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - live
        - live-write
        - tutorial
        - snapshot
        - hosted sandbox (fly.io)
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network (if live)
      placeholder: devnet / mainnet / mesa
  - type: input
    id: version
    attributes:
      label: Version
      description: "`npx @o1-labs/mina-mcp-server --version` or the git SHA / hosted URL"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Which tool did you call, with what args, and what came back?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Server stderr or the MCP client transcript (redact any secrets).
      render: shell
