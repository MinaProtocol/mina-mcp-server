# Fly.io app config for the bundled MCP server + Mina lightnet image.
# Public URL: https://mina-mcp-sandbox.fly.dev

app = "mina-mcp-sandbox"
primary_region = "iad"

kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  MINA_MCP_MODE = "tutorial"
  MINA_MCP_TRANSPORT = "http"
  MINA_MCP_HTTP_PORT = "3000"

# MCP HTTP transport — primary entry point for AI clients
[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "get"
    path = "/health"

# Explorer UI + GraphQL playground (NGINX reverse-proxy on the lightnet side)
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
